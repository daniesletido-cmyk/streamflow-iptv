name: Build iOS IPA (Capacitor)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    name: Build Unsigned iOS .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required by Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Build & Archive with Xcode (Unsigned for Sideloading)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build/App.xcarchive" -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in xcarchive"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r StreamFlow-IPTV.ipa Payload

      - name: Upload StreamFlow-IPTV.ipa as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-IPTV-ipa
          path: StreamFlow-IPTV.ipa
          if-no-files-found: error
