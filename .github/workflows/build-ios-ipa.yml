name: Build iOS IPA (Capacitor)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    name: Build Unsigned iOS .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Diagnostic Sync
        run: |
          OUTPUT=$(npx cap sync ios --verbose 2>&1 || true)
          echo "Captured output:"
          echo "$OUTPUT"
          echo "::notice title=CapacitorSyncOutput::$OUTPUT"

      - name: Build & Archive with Xcode (Unsigned for Sideloading)
        run: |
          XCODE_OUTPUT=$(xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 || true)
          echo "$XCODE_OUTPUT"
          echo "::notice title=XcodeOutput::$XCODE_OUTPUT"

      - name: Package Payload into .ipa
        run: |
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            mkdir -p Payload
            cp -r build/App.xcarchive/Products/Applications/App.app Payload/
            zip -r StreamFlow-IPTV.ipa Payload
          else
            echo "Archive not found"
            exit 1
          fi

      - name: Upload StreamFlow-IPTV.ipa as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-IPTV-ipa
          path: StreamFlow-IPTV.ipa
          if-no-files-found: error
