name: Build iOS IPA (Capacitor)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    name: Build Unsigned iOS .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios --verbose

      - name: Build & Archive with Xcode (Unsigned for Sideloading)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          echo "Building using target: $TARGET_FLAG"

          xcodebuild archive \
            $TARGET_FLAG \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into .ipa
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r StreamFlow-IPTV.ipa Payload

      - name: Upload StreamFlow-IPTV.ipa as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-IPTV-ipa
          path: StreamFlow-IPTV.ipa
          if-no-files-found: error
